[package]
name = "zenkit-world-viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
description = "Gothic world viewer built with ZenKit and wgpu"

# Keep renderer dependencies and the lockfile out of the library workspace.
[workspace]

[dependencies]
zenkit = { path = "../../crates/zenkit" }
anyhow = "1.0"
bytemuck = "1.24"
clap = { version = "4.5", features = ["derive"] }
glam = "0.30"
image = { version = "0.25", default-features = false, features = ["png", "tga"] }
pollster = "0.4"
wgpu = "27.0.1"
winit = "0.30"

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
