[package]
name = "zenkit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Safe Rust readers, writers and Daedalus runtime for Gothic data formats"
readme = "README.md"
include = ["src/**", "examples/*.rs", "tests/*.rs", "tests/*.inc", "tests/workflows/*.rs", "tests/fixtures/*", "README.md", "LICENSE", "Cargo.toml", "Cargo.lock"]

[dependencies]
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }

[lints]
workspace = true
